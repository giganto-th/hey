name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  translations:
    # every visible string needs an English translation (runs anywhere, no Swift needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/l10n_keys.py

  pet-art:
    # a pet clip whose frames slide around (feet, keyboard, body) shows up as jerky motion; see docs/SPRITE_PIPELINE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow
      - run: python3 docs/art-tools/clip_report.py --check

  build:
    # The app runs on macOS 15 and later, so build and test on the oldest and the newest it supports.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest"
          xcodebuild -version
          sw_vers
          swift --version
      - run: swift build
      - run: swift test
