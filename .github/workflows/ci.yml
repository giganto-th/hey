name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Check every visible string has an English translation
        run: python3 scripts/l10n_keys.py
      - name: Build the app bundle
        run: bash scripts/make-app.sh
